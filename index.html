<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Play Job Service</title>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    fbq('init', '1790684428719160');
    fbq('track', 'PageView');
  </script>

  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1790684428719160&ev=PageView&noscript=1"
      alt=""
    >
  </noscript>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          135deg,
          #050505,
          #151515,
          #050505
        );

      color: #ffffff;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      padding: 15px;
    }

    .page {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 10px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 15px;
      color: #cfcfcf;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .timer-box {
      margin: 0 0 15px;
      font-size: 14px;
      color: #dcdcdc;
    }

    #countdown {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    #joinButton {
      width: 100%;
      border: none;
      border-radius: 14px;

      padding: 17px 18px;

      font-size: 17px;
      font-weight: 800;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #229ed9,
          #168dcc
        );

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(34,158,217,0.30);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    #joinButton:hover {
      transform: translateY(-1px);
    }

    #joinButton:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 13px;
      font-size: 12px;
      color: #999999;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .title {
        font-size: 24px;
      }

      .subtitle {
        font-size: 14px;
      }

      #joinButton {
        font-size: 16px;
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="title">
      Play Job Service
    </div>

    <div class="subtitle">
      Join our Telegram channel to continue.
    </div>

    <div class="timer-box">
      Redirecting in
      <strong id="countdown">10</strong>
      seconds...
    </div>

    <button id="joinButton" type="button">
      🚀 Join Play Job Service on Telegram
    </button>

    <div class="note">
      Click the button to continue to Telegram.
    </div>

  </main>

  <script>

    const TELEGRAM_URL =
      "https://t.me/+YijDu89OvTYyYWJl";

    const pageLoadedAt =
      performance.now();

    const button =
      document.getElementById("joinButton");

    const countdown =
      document.getElementById("countdown");

    let redirected = false;
    let seconds = 10;


    /* =========================
       10 SECOND AUTO REDIRECT
       ========================= */

    const timer = setInterval(function () {

      seconds--;

      countdown.textContent = seconds;

      if (seconds <= 0) {

        clearInterval(timer);

        /*
          Automatic redirect par
          Subscribe event FIRE NAHI HOGA.
        */

        if (!redirected) {

          redirected = true;

          window.location.href =
            TELEGRAM_URL;
        }
      }

    }, 1000);


    /* =========================
       BUTTON CLICK
       ========================= */

    button.addEventListener(
      "click",
      function () {

        const elapsed =
          performance.now() - pageLoadedAt;

        /*
          First 0.8 second ka click ignore.
        */

        if (elapsed < 800) {
          return;
        }

        /*
          Agar timer already redirect
          kar chuka hai to event nahi.
        */

        if (redirected) {
          return;
        }

        redirected = true;


        /*
          Subscribe sirf button click par.
        */

        if (typeof fbq === "function") {

          fbq(
            "track",
            "Subscribe"
          );

        }


        /*
          Button click ke 300ms baad
          Telegram redirect.
        */

        setTimeout(function () {

          window.location.href =
            TELEGRAM_URL;

        }, 300);

      }
    );

  </script>

</body>
</html>
